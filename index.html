class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error(error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 20, fontFamily: "monospace", color: "#fca5a5", background: "#020617", minHeight: "100vh" }}>
          <p style={{ fontWeight: "bold", marginBottom: 8 }}>Something went wrong.</p>
          <p style={{ whiteSpace: "pre-wrap", fontSize: 12 }}>{String(this.state.error && this.state.error.message)}</p>
        </div>
      );
    }
    return this.props.children;
  }
}

/*  Storage layer — tries real localStorage, silently falls back to an   */
/*  in-memory store if the environment blocks it (e.g. sandboxed preview) */
/* ---------------------------------------------------------------------- */
const memoryStore = {};
const storage = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw !== null) return JSON.parse(raw);
    } catch (e) {
      /* blocked or unavailable — fall through to memory */
    }
    return key in memoryStore ? memoryStore[key] : fallback;
  },
  set(key, value) {
    memoryStore[key] = value;
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* blocked — memory copy above still keeps the app working this session */
    }
  },
};

function pad2(n) { return String(n).padStart(2, "0"); }
function toLocalInputDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function toLocalInputTime(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function combineDateTime(dateStr, timeStr) { return `${dateStr}T${timeStr}`; }
function sameCalendarDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function formatDateLabel(dateStr, lang) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function formatDueShort(dueDateTime, lang) {
  const d = new Date(dueDateTime);
  const datePart = d.toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", { day: "numeric", month: "short" });
  const timePart = d.toLocaleTimeString(lang === "hi" ? "hi-IN" : "en-IN", { hour: "2-digit", minute: "2-digit" });
  return `${datePart}, ${timePart}`;
}
function getStatus(task, now) {
  if (task.completed) return "completed";
  const due = new Date(task.dueDateTime).getTime();
  if (due < now.getTime()) return "overdue";
  if (sameCalendarDay(new Date(task.dueDateTime), now)) return "today";
  return "upcoming";
}
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [0, 0.22].forEach((delay) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.2);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 700);
  } catch (e) { /* audio unavailable */ }
}

function categoryStyle(category) {
  if (!category) return { bg: "bg-slate-500/15", text: "text-slate-300", dot: "bg-slate-400" };
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = (hash * 31 + category.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
}

}

function TaskFormModal({ open, onClose, onSubmit, initial, T, th }) {
  const now = new Date();
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [priority, setPriority] = useState("medium");
  const [date, setDate] = useState(toLocalInputDate(now));
  const [time, setTime] = useState(toLocalInputTime(new Date(now.getTime() + 60 * 60000)));
  const [category, setCategory] = useState("");
  const [repeatMinutes, setRepeatMinutes] = useState(0);
  const [alertNotification, setAlertNotification] = useState(true);
  const [alertSound, setAlertSound] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!open) return;
    if (initial) {
      const d = new Date(initial.dueDateTime);
      setTitle(initial.title || "");
      setDescription(initial.description || "");
      setPriority(initial.priority || "medium");
      setDate(toLocalInputDate(d));
      setTime(toLocalInputTime(d));
      setCategory(initial.category || "");
      setRepeatMinutes(initial.repeatMinutes ?? 0);
      setAlertNotification(initial.alertNotification !== false);
      setAlertSound(initial.alertSound !== false);
    } else {
      const n = new Date();
      setTitle(""); setDescription(""); setPriority("medium");
      setDate(toLocalInputDate(n));
      setTime(toLocalInputTime(new Date(n.getTime() + 60 * 60000)));
      setCategory(""); setRepeatMinutes(0);
      setAlertNotification(true); setAlertSound(true);
    }
    setError("");
  }, [open, initial]);

  if (!open) return null;

  const handleSubmit = () => {
    if (!title.trim()) { setError(T.titleRequired); return; }
    onSubmit({
      title: title.trim(),
      description: description.trim(),
      priority,
      dueDateTime: combineDateTime(date, time),
      category: category.trim(),
      repeatMinutes: Number(repeatMinutes),
      alertNotification,
      alertSound,
    });
  };

  const inputCls = cx("w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2", th.border, th.inputBg, th.text, th.ring);
  const labelCls = cx("text-xs font-semibold mb-1 block", th.muted);

  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60" onClick={onClose}>
      <div
        className={cx("w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-5 border", th.surface, th.text, th.border)}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold">{initial ? T.editTask : T.newTask}</h3>
          <button onClick={onClose} className={th.muted}><X size={20} /></button>
        </div>

        <div className="space-y-3">
          <div>
            <label className={labelCls}>{T.title}</label>
            <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} autoFocus />
          </div>
          <div>
            <label className={labelCls}>{T.description}</label>
            <textarea className={cx(inputCls, "min-h-[60px] resize-none")} value={description} onChange={(e) => setDescription(e.target.value)} />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={labelCls}>{T.dueDate}</label>
              <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
            </div>
            <div>
              <label className={labelCls}>{T.dueTime}</label>
              <input type="time" className={inputCls} value={time} onChange={(e) => setTime(e.target.value)} />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={labelCls}>{T.priority}</label>
              <select className={inputCls} value={priority} onChange={(e) => setPriority(e.target.value)}>
                <option value="low">{T.low}</option>
                <option value="medium">{T.medium}</option>
                <option value="high">{T.high}</option>
              </select>
            </div>
            <div>
              <label className={labelCls}>{T.category}</label>
              <input list="pwrc-categories" className={inputCls} value={category} onChange={(e) => setCategory(e.target.value)} />
              <datalist id="pwrc-categories">
                {CATEGORY_SUGGESTIONS.map((c) => <option key={c} value={c} />)}
              </datalist>
            </div>
          </div>

          <div>
            <label className={labelCls}>{T.repeat}</label>
            <select className={inputCls} value={repeatMinutes} onChange={(e) => setRepeatMinutes(e.target.value)}>
              {REPEAT_OPTIONS.map((m) => <option key={m} value={m}>{T[repeatLabelKey(m)]}</option>)}
            </select>
          </div>

          <div>
            <label className={labelCls}>{T.alertVia}</label>
            <div className="flex gap-4">
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={alertNotification} onChange={(e) => setAlertNotification(e.target.checked)} />
                {T.notification}
              </label>
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={alertSound} onChange={(e) => setAlertSound(e.target.checked)} />
                {T.sound}
              </label>
            </div>
          </div>

          {error && <p className="text-red-400 text-sm">{error}</p>}

          <div className="flex gap-2 pt-2">
            <button onClick={onClose} className={cx("flex-1 rounded-lg border py-2.5 text-sm font-semibold", th.border, th.muted)}>
              {T.cancel}

/* ---------------------------------------------------------------------- */
/*  Main App                                                               */
/* ---------------------------------------------------------------------- */
function App() {
  const [tasks, setTasks] = useState(() => storage.get(TASKS_KEY, []));
  const [settings, setSettings] = useState(() => storage.get(SETTINGS_KEY, { dark: true, lang: "en" }));
  const [activeTab, setActiveTab] = useState("home");
  const [homeFilter, setHomeFilter] = useState("all");
  const [now, setNow] = useState(new Date());
  const [modalOpen, setModalOpen] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [notifPermission, setNotifPermission] = useState(
    typeof window !== "undefined" && "Notification" in window ? Notification.permission : "unsupported"
  );
  const [toast, setToast] = useState("");
  const fileInputRef = useRef(null);
  const notifPermissionRef = useRef(notifPermission);
  useEffect(() => { notifPermissionRef.current = notifPermission; }, [notifPermission]);

  const lang = settings.lang;
  const dark = settings.dark;
  const T = translations[lang];
  const th = useThemeTokens(dark);

  useEffect(() => { storage.set(TASKS_KEY, tasks); }, [tasks]);
  useEffect(() => { storage.set(SETTINGS_KEY, settings); }, [settings]);

  useEffect(() => {
    const iv = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  /* alert engine — checks every 15s while the tab is open */
  useEffect(() => {
    const iv = setInterval(() => {
      const nowTs = Date.now();
      setTasks((prev) => {
        let changed = false;
        const updated = prev.map((t) => {
          if (t.completed) return t;
          const dueTs = new Date(t.dueDateTime).getTime();
          const snoozedTs = t.snoozedUntil ? new Date(t.snoozedUntil).getTime() : 0;
          if (dueTs <= nowTs && snoozedTs <= nowTs) {
            const lastTs = t.lastNotifiedAt ? new Date(t.lastNotifiedAt).getTime() : 0;
            const intervalMs = (t.repeatMinutes && t.repeatMinutes > 0 ? t.repeatMinutes : 5) * 60000;
            if (nowTs - lastTs >= intervalMs) {
              if (t.alertNotification && notifPermissionRef.current === "granted") {
                try {
                  const n = new Notification(t.title, { body: t.description || t.category || "Pending Work Reminder", tag: t.id });
                  n.onclick = () => window.focus();
                } catch (e) {}
              }
              if (t.alertSound) playBeep();
              changed = true;
              return { ...t, lastNotifiedAt: new Date().toISOString() };
            }
          }
          return t;
        });
        return changed ? updated : prev;
      });
    }, 15000);
    return () => clearInterval(iv);
  }, []);

  const { overdue, today, upcoming, completed, pendingCount } = useMemo(() => {
    const pending = tasks.filter((t) => !t.completed);
    const overdue = pending.filter((t) => getStatus(t, now) === "overdue").sort((a, b) => new Date(a.dueDateTime) - new Date(b.dueDateTime));
    const today = pending.filter((t) => getStatus(t, now) === "today").sort((a, b) => new Date(a.dueDateTime) - new Date(b.dueDateTime));
    const upcoming = pending.filter((t) => getStatus(t, now) === "upcoming").sort((a, b) => new Date(a.dueDateTime) - new Date(b.dueDateTime));
    const completed = tasks.filter((t) => t.completed).sort((a, b) => new Date(b.dueDateTime) - new Date(a.dueDateTime));
    return { overdue, today, upcoming, completed, pendingCount: pending.length };
  }, [tasks, now]);

  const addOrUpdateTask = useCallback((data) => {
    if (editingTask) {
      setTasks((prev) => prev.map((t) => (t.id === editingTask.id ? { ...t, ...data, lastNotifiedAt: null } : t)));
    } else {
      setTasks((prev) => [
        ...prev,
        { id: uid(), ...data, completed: false, createdAt: new Date().toISOString(), snoozedUntil: null, lastNotifiedAt: null },
      ]);
    }
    setModalOpen(false);
    setEditingTask(null);
  }, [editingTask]);

  const toggleComplete = useCallback((id) => {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, completed: !t.completed, lastNotifiedAt: null } : t)));
  }, []);

  const deleteTask = useCallback((id) => {
    if (!window.confirm(T.confirmDelete)) return;
    setTasks((prev) => prev.filter((t) => t.id !== id));
  }, [T]);

  const snoozeTask = useCallback((id, minutes) => {
    setTasks((prev) => prev.map((t) => (
      t.id === id ? { ...t, snoozedUntil: new Date(Date.now() + minutes * 60000).toISOString(), lastNotifiedAt: new Date().toISOString() } : t
    )));
  }, []);

  const requestNotifPermission = async () => {
    if (!("Notification" in window)) { setNotifPermission("unsupported"); return; }
    const res = await Notification.requestPermission();
    setNotifPermission(res);
  };

  const exportBackup = () => {
    const payload = { tasks, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pending-work-backup-${toLocalInputDate(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (Array.isArray(parsed.tasks)) {
          setTasks(parsed.tasks);
          if (parsed.settings) setSettings((s) => ({ ...s, ...parsed.settings }));
          setToast(T.importSuccess);
        } else {
          setToast(T.importFail);
        }
      } catch (e) {
        setToast(T.importFail);
      }
    };
    reader.readAsText(file);
  };

  const clearAll = () => {
    if (!window.confirm(T.clearConfirm)) return;
    setTasks([]);
  };

  const openEdit = (task) => { setEditingTask(task); setModalOpen(true); };
  const openAdd = () => { setEditingTask(null); setModalOpen(true); };

  const calendarGroups = useMemo(() => {
    const map = {};
    tasks.filter((t) => !t.completed).forEach((t) => {
      const key = toLocalInputDate(new Date(t.dueDateTime));
      if (!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map)
      .sort(([a], [b]) => (a < b ? -1 : 1))
      .map(([date, items]) => [date, items.sort((a, b) => new Date(a.dueDateTime) - new Date(b.dueDateTime))]);
  }, [tasks]);

  const rowProps = { now, T, lang, th, onToggle: toggleComplete, onEdit: openEdit, onDelete: deleteTask, onSnooze: snoozeTask };

  return (
    <div className={cx("min-h-screen font-sans", th.bg, th.text)}>
      <div className="flex max-w-4xl mx-auto sm:min-h-screen">
        <SideNav active={activeTab} setActive={setActiveTab} T={T} th={th} />

        <div className="flex-1 pb-24 sm:pb-6 min-w-0">
          <ClockHero now={now} T={T} lang={lang} th={th} pendingCount={pendingCount} />

          {activeTab === "home" && (
            <>
              <StatCards
                counts={{ overdue: overdue.length, today: today.length, upcoming: upcoming.length, completed: completed.length }}
                filter={homeFilter}
                setFilter={setHomeFilter}
                T={T}
                th={th}
              />
              <div className="px-3 pt-3 pb-4">
                {tasks.length === 0 ? (
                  <p className={cx("py-8 text-center text-sm", th.muted)}>{T.noTasksAtAll}</p>
                ) : (
                  <>
                    {(homeFilter === "all" || homeFilter === "overdue") && (
                      <Section label={T.overdue} count={overdue.length} icon={AlertOctagon} iconBg="bg-red-500/15" iconText="text-red-400" empty={T.noOverdue} th={th}>
                        {overdue.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                      </Section>
                    )}
                    {(homeFilter === "all" || homeFilter === "today") && (
                      <Section label={T.dueToday} count={today.length} icon={Sunrise} iconBg="bg-amber-400/15" iconText="text-amber-400" empty={T.noToday} th={th}>
                        {today.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                      </Section>
                    )}
                    {(homeFilter === "all" || homeFilter === "upcoming") && (
                      <Section label={T.upcoming} count={upcoming.length} icon={CalendarClock} iconBg="bg-sky-400/15" iconText="text-sky-400" empty={T.noUpcoming} th={th}>
                        {upcoming.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                      </Section>
                    )}
                    {homeFilter === "completed" && (
                      <Section label={T.completed} count={completed.length} icon={CheckCircle2} iconBg="bg-emerald-400/15" iconText="text-emerald-400" empty={T.noCompleted} th={th}>
                        {completed.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                      </Section>
                    )}
                  </>
                )}
              </div>
            </>
          )}

          {activeTab === "calendar" && (
            <div className="px-3 pt-4 pb-4">
              {calendarGroups.length === 0 ? (
                <p className={cx("py-8 text-center text-sm", th.muted)}>{T.calendarEmpty}</p>
              ) : (
                calendarGroups.map(([date, items]) => (
                  <div key={date} className="mb-4">
                    <div className="flex items-center gap-2 mb-2">
                      <ChevronRight size={14} className="text-amber-400" />
                      <h3 className={cx("text-sm font-bold", th.text)}>{formatDateLabel(date, lang)}</h3>
                    </div>
                    <div className="space-y-2">
                      {items.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {activeTab === "completed" && (
            <div className="px-3 pt-4 pb-4">
              {completed.length === 0 ? (
                <p className={cx("py-8 text-center text-sm", th.muted)}>{T.noCompleted}</p>
              ) : (
                <div className="space-y-2">
                  {completed.map((t) => <TaskCard key={t.id} task={t} {...rowProps} />)}
                </div>
              )}
            </div>
          )}

          {activeTab === "settings" && (
            <div className="px-4 pt-4 pb-4 space-y-6">
              <div>
                <h3 className={cx("text-xs uppercase tracking-wide font-semibold mb-2", th.muted)}>{T.darkMode}</h3>
                <button
                  onClick={() => setSettings((s) => ({ ...s, dark: !s.dark }))}
                  className={cx("w-full flex items-center justify-between rounded-xl border px-4 py-3", th.border, th.surface)}
                >
                  <span className="flex items-center gap-2 text-sm font-medium">{dark ? <Moon size={16} /> : <Sun size={16} />} {T.darkMode}</span>
                  <span className={cx("h-6 w-10 rounded-full relative transition-colors", dark ? "bg-amber-400" : cx("border", th.border))}>
                    <span className={cx("absolute top-0.5 h-5 w-5 rounded-full bg-white transition-all", dark ? "left-5" : "left-0.5")} />
                  </span>
                </button>
              </div>

              <div>
                <h3 className={cx("text-xs uppercase tracking-wide font-semibold mb-2", th.muted)}>{T.language}</h3>
                <div className={cx("flex rounded-xl border overflow-hidden", th.border)}>
                  {["en", "hi"].map((l) => (
                    <button
                      key={l}
                      onClick={() => setSettings((s) => ({ ...s, lang: l }))}
                      className={cx("flex-1 py-2.5 text-sm flex items-center justify-center gap-1.5",
                        lang === l ? "bg-amber-400 text-slate-900 font-bold" : cx(th.surface, "font-medium"))}
                    >
                      <Languages size={14} /> {l === "en" ? "English" : "हिन्दी"}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <h3 className={cx("text-xs uppercase tracking-wide font-semibold mb-2", th.muted)}>{T.notifPermTitle}</h3>
                <div className={cx("rounded-xl border px-4 py-3", th.border, th.surface)}>
                  <div className="flex items-center justify-between">
                    <span className="flex items-center gap-2 text-sm font-medium">
                      {notifPermission === "granted" ? <Bell size={16} className="text-amber-400" /> : <BellOff size={16} className={th.muted} />}
                      {notifPermission === "granted" ? T.granted : notifPermission === "denied" ? T.denied : notifPermission === "unsupported" ? T.unsupported : T.notAsked}
                    </span>
                    {notifPermission !== "granted" && notifPermission !== "unsupported" && (
                      <button onClick={requestNotifPermission} className="text-xs px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 font-bold">
                        {T.enableNotif}
                      </button>
                    )}
                  </div>
                </div>
              </div>

              <div>
                <h3 className={cx("text-xs uppercase tracking-wide font-semibold mb-2", th.muted)}>{T.dataTitle}</h3>
                <div className="space-y-2">
                  <button onClick={exportBackup} className={cx("w-full flex items-center gap-2 rounded-xl border px-4 py-3 text-sm font-medium", th.border, th.surface)}>
                    <Download size={16} /> {T.exportBackup}
                  </button>
                  <button onClick={() => fileInputRef.current?.click()} className={cx("w-full flex items-center gap-2 rounded-xl border px-4 py-3 text-sm font-medium", th.border, th.surface)}>
                    <Upload size={16} /> {T.importBackup}
                  </button>
                  <input
                    ref={fileInputRef} type="file" accept="application/json" className="hidden"
                    onChange={(e) => { const f = e.target.files?.[0]; if (f) importBackup(f); e.target.value = ""; }}
                  />
                  <button onClick={clearAll} className="w-full flex items-center gap-2 rounded-xl border border-red-500/40 px-4 py-3 text-sm font-medium text-red-400">
                    <Trash2 size={16} /> {T.clearAll}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      <button
        onClick={openAdd}
        className="fixed right-4 bottom-20 sm:bottom-6 h-14 w-14 rounded-full bg-amber-400 text-slate-900 shadow-lg flex items-center justify-center hover:bg-amber-300 z-30"
        aria-label={T.addTask}
      >
        <Plus size={26} strokeWidth={2.5} />
      </button>

      <TabBar active={activeTab} setActive={setActiveTab} T={T} th={th} />

      <TaskFormModal
        open={modalOpen}
        onClose={() => { setModalOpen(false); setEditingTask(null); }}
        onSubmit={addOrUpdateTask}
        initial={editingTask}
        T={T}
        th={th}
      />

      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50 flex items-center gap-2 border border-slate-700">
          <AlertTriangle size={14} className="text-amber-400" /> {toast}
        </div>
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(
  <ErrorBoundary><App /></ErrorBoundary>
);

</script>

<script>
(function () {
  var diag = document.getElementById("diag");
  function log(msg) { diag.textContent += msg + "\n"; }
  function showError(label, err) {
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    var detail = (err && err.stack) ? err.stack : (err && err.message ? err.message : String(err));
    box.textContent += label + ": " + detail + "\n\n";
    log(label + " -- see red text below");
  }

  log("Tailwind: " + (window.tailwind ? "loaded" : "NOT loaded"));
  log("React: " + (window.React ? "loaded (v" + window.React.version + ")" : "NOT loaded"));
  log("ReactDOM: " + (window.ReactDOM ? "loaded" : "NOT loaded"));
  log("ReactDOM.createRoot: " + (window.ReactDOM && window.ReactDOM.createRoot ? "available" : "MISSING"));
  log("Babel: " + (window.Babel ? "loaded" : "NOT loaded"));

  try {
    var sourceEl = document.getElementById("app-source");
    log("Source element found: " + (sourceEl ? "yes" : "NO"));
    var source = sourceEl.textContent;
    log("Source length: " + source.length + " chars");

    var result = Babel.transform(source, { presets: ["react"], filename: "app.jsx" });
    log("Babel compile: OK (" + result.code.length + " chars output)");

    var script = document.createElement("script");
    script.textContent = result.code;
    document.body.appendChild(script);
    log("Script appended to page.");

    setTimeout(function () {
      var rootEl = document.getElementById("root");
      log("Root element children after 500ms: " + rootEl.children.length);
      if (rootEl.children.length === 0) {
        log("Nothing rendered into #root -- app code ran but produced no output, or React never called render.");
      } else {
        log("App appears to have rendered.");
      }
    }, 500);
  } catch (err) {
    showError("Compile error", err);
  }

  window.addEventListener("error", function (e) {
    if (e.error) showError("Runtime error", e.error);
  });
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
